
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My DevOps Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1e293b;
      text-align: center;
      padding: 70px 20px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px #0001;
    }
    h1 { color: #2563eb; }
    .status {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 10px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My First DevOps Project</h1>
    <p>A web application powered by Docker.</p>
    <p class="status">Application is ready!</p>
    <p>Next: GitHub, CI/CD and automated deployment.</p>
  </div>
</body>
</html>
